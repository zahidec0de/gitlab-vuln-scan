name: "Update version hashes and CVE database"
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 5 * * *"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependencies
        run: pip install requests
      - name: Update gitlab_hashes.json (webpack/commit hash -> version)
        working-directory: ./automation
        run: |
          python get_gitlab_hashes.py ../gitlab_hashes.json --budget-minutes=80
      - name: Update gitlab_cves.json (NVD -> affected version ranges)
        working-directory: ./automation
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          python get_gitlab_cves.py ../gitlab_cves.json --since-days 14
      - uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: automatic update
